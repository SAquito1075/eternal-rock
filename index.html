<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181a" media="(prefers-color-scheme: dark)">
<title>Eternal Rock</title>
<meta name="description" content="Eternal Rock International Ministries — listen to any episode on your platform of choice.">

<meta property="og:title" content="Eternal Rock — International Ministries">
<meta property="og:description" content="Weekly sermons to strengthen your faith, wherever you already listen.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=Overpass+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     Eternal Rock — homepage / episode index.
     Lists every episode; each one links to its own page
     (e.g. /equipped-for-war) where the platform buttons live.
     TO ADD A NEW EPISODE: scroll to the EPISODES array near
     the bottom and add one line — newest episode goes first.
     ========================================================== */

  :root{
    --bg-1:#eef2f1;
    --bg-2:#e2e9e7;
    --glow-1:#d9b98f;
    --glow-2:#9db8bd;
    --surface:rgba(255,255,255,0.75);
    --surface-border:rgba(255,255,255,0.9);
    --ink:#182022;
    --ink-muted:#5f6968;
    --line:rgba(24,32,34,0.1);
    --accent:#2f6066;
    --accent-2:#3c7d84;
    --focus:#2f6066;

    --font-display:'Big Shoulders Display', 'Arial Narrow', sans-serif;
    --font-body:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'Overpass Mono', ui-monospace, SFMono-Regular, monospace;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-1:#12171a;
      --bg-2:#161c1a;
      --glow-1:#3c2f22;
      --glow-2:#1f3a3d;
      --surface:rgba(255,255,255,0.06);
      --surface-border:rgba(255,255,255,0.12);
      --ink:#e7ebe8;
      --ink-muted:#93a09d;
      --line:rgba(255,255,255,0.1);
      --accent:#6fb3ba;
      --accent-2:#5aa0a8;
      --focus:#6fb3ba;
    }
  }

  :root[data-theme="dark"]{
    --bg-1:#12171a;
    --bg-2:#161c1a;
    --glow-1:#3c2f22;
    --glow-2:#1f3a3d;
    --surface:rgba(255,255,255,0.06);
    --surface-border:rgba(255,255,255,0.12);
    --ink:#e7ebe8;
    --ink-muted:#93a09d;
    --line:rgba(255,255,255,0.1);
    --accent:#6fb3ba;
    --accent-2:#5aa0a8;
    --focus:#6fb3ba;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(55% 42% at 12% 0%, var(--glow-1) 0%, transparent 60%),
      radial-gradient(55% 40% at 100% 18%, var(--glow-2) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .page{
    width:100%;
    max-width:440px;
    min-height:100vh;
    padding:0 18px 32px;
    display:flex;
    flex-direction:column;
  }

  .hero{
    padding:48px 4px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    opacity:0;
    animation:rise .7s cubic-bezier(.22,.9,.32,1) .05s forwards;
  }

  .badge{
    width:72px;
    height:72px;
    border-radius:22px;
    background:linear-gradient(150deg, #e8a765 0%, #4a3f66 55%, #1c2947 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 18px 34px -14px rgba(20,30,40,0.45);
  }

  .badge svg{ width:34px; height:34px; }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:18px 0 4px;
  }

  .mark{
    font-family:var(--font-display);
    font-weight:800;
    font-size:44px;
    line-height:0.95;
    letter-spacing:-0.01em;
    margin:0 0 10px;
  }

  .tagline{
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink-muted);
    max-width:320px;
    margin:0 0 6px;
  }

  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .list-label{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:28px 2px 10px;
  }

  .episodes{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .ep{
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px;
    border-radius:18px;
    background:var(--surface);
    border:1px solid var(--surface-border);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    transition:transform .15s ease, box-shadow .15s ease;
  }

  .ep:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 22px -14px rgba(20,30,40,0.35);
  }

  .ep-cover{
    width:56px;
    height:56px;
    border-radius:14px;
    object-fit:cover;
    flex:none;
    background:linear-gradient(150deg, #e8a765 0%, #4a3f66 55%, #1c2947 100%);
  }

  .ep-info{
    flex:1;
    min-width:0;
  }

  .ep-title{
    font-weight:700;
    font-size:15px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .ep-cta{
    font-family:var(--font-mono);
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-top:2px;
  }

  .ep-arrow{
    flex:none;
    width:18px;
    height:18px;
    color:var(--ink-muted);
  }

  .empty{
    text-align:center;
    color:var(--ink-muted);
    font-size:13.5px;
    padding:24px 8px;
  }

  footer{
    margin-top:auto;
    padding-top:32px;
    text-align:center;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:14px;
  }

  .socials a{
    color:var(--ink-muted);
    display:flex;
  }

  .socials svg{ width:19px; height:19px; }

  .copyright{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--ink-muted);
    letter-spacing:0.02em;
  }

  @media (prefers-reduced-motion: reduce){
    .hero{ animation:none !important; opacity:1; }
    .ep{ transition:none; }
    .ep:hover{ transform:none; }
  }
</style>
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.4M12 19.1v2.4M4.2 12H1.8M22.2 12h-2.4M6.2 6.2 4.5 4.5M19.5 19.5l-1.7-1.7M6.2 17.8l-1.7 1.7M19.5 4.5l-1.7 1.7"/>
      </svg>
    </div>
    <p class="eyebrow">International Ministries</p>
    <h1 class="mark">Eternal Rock</h1>
    <p class="tagline">Weekly sermons to strengthen your faith, wherever you already listen.</p>
  </header>

  <p class="list-label">Episodes</p>
  <div class="episodes" id="episode-list"></div>

  <footer>
    <div class="socials">
      <a href="https://www.instagram.com/eternalrockim/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="17.2" cy="6.8" r="1"/></svg>
      </a>
      <a href="https://www.facebook.com/EtRoInMinistries/" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 21v-7.5h2.5l.5-3.2h-3V8.2c0-.9.3-1.6 1.7-1.6h1.4V3.8C16.8 3.6 15.7 3.5 14.6 3.5c-2.4 0-4.1 1.5-4.1 4.2v2.6H8v3.2h2.5V21"/></svg>
      </a>
      <a href="https://www.youtube.com/@InternationalEternalRock" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M10.5 9.5v5l4.5-2.5-4.5-2.5z" fill="currentColor" stroke="none"/></svg>
      </a>
    </div>
    <p class="copyright">&copy; <span id="year"></span> Eternal Rock International Ministries</p>
  </footer>

</div>

<script>
  // Newest episode goes FIRST in this list. To add a new episode:
  // 1. Duplicate the "_plantilla-episodio" folder, rename it to a short
  //    URL-friendly slug (e.g. "faith-over-fear"), fill in its cover,
  //    title and platform links.
  // 2. Add one entry below pointing "slug" at that folder's name.
  const EPISODES = [
    {
      title: "Lesson 10 Prayer 2",
      slug: "lesson-10-prayer",
      cover: "lesson-10-prayer/lesson-10-prayer.jpg"
    },
    {
      title: "Equipped for War",
      slug: "equipped-for-war",
      cover: "equipped-for-war/equipped-for-war.webp"
    }
  ];

  const listEl = document.getElementById('episode-list');

  if (EPISODES.length === 0) {
    listEl.innerHTML = '<p class="empty">No episodes yet — check back soon.</p>';
  } else {
    EPISODES.forEach(ep => {
      const a = document.createElement('a');
      a.className = 'ep';
      a.href = './' + ep.slug + '/';
      a.innerHTML = `
        <img class="ep-cover" src="${ep.cover}" alt="" loading="lazy">
        <div class="ep-info">
          <div class="ep-title">${ep.title}</div>
          <div class="ep-cta">Listen now</div>
        </div>
        <svg class="ep-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      `;
      listEl.appendChild(a);
    });
  }

  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
